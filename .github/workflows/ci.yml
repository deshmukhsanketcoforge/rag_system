name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned, and kept out of requirements.txt so the app image stays lean.
      - name: Install ruff
        run: pip install ruff==0.17.6

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only torch first: the default Linux wheel bundles CUDA (several GB).
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The eval tests download two models (embedding + cross-encoder, ~200 MB). Cached, so a run
      # only downloads on a cold cache. The key hashes config.py, so changing a model (or any other
      # setting there) starts a fresh cache instead of restoring a stale one that is never re-saved.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('src/rag/config.py') }}

      # Tests marked `llm` call the API. They are skipped when the secret is missing
      # (forks, or a repo without it), so CI stays green either way.
      - name: Run tests
        run: pytest -v
        env:
          ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          ANTHROPIC_FOUNDRY_BASE_URL: ${{ secrets.ANTHROPIC_FOUNDRY_BASE_URL }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rag-system .

      - name: Run tests in the container
        run: docker run --rm rag-system pytest -v
